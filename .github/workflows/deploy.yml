name: 🚀 Deploy to Contabo VPS

on:
  push:
    branches:
      - production
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taxsuite-backend:latest
          no-cache: true

      - name: 🏗️ Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taxsuite-frontend:latest
          no-cache: true

      - name: 🚀 Deploy to VPS
        if: github.ref == 'refs/heads/production'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER || secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment on $(hostname)..."
            cd /home/maruf_project/bangladesh_tax_suite

            echo "🔄 Pulling latest code..."
            git checkout production
            git pull origin production

            echo "🔄 Pulling latest pre-built Docker images..."
            docker compose -f docker-compose.prod.yml pull || true

            echo "🔄 Starting containers..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "🧽 Cleaning dangling images..."
            docker image prune -f

            echo "✅ Verifying running containers..."
            docker ps | grep tax_backend_prod && echo "✅ Backend container is running!" || echo "❌ Backend container failed!"
            docker ps | grep tax_frontend_prod && echo "✅ Frontend container is running!" || echo "❌ Frontend container failed!"

            echo "🎉 Deployment completed successfully!"
