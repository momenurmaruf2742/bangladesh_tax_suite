services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tax_postgres_prod
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-tax_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tax_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend
  backend:
    image: ghcr.io/momenurmaruf2742/taxsuite-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tax_backend_prod
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. React Frontend (Nginx Build on Port 3000)
  frontend:
    image: ghcr.io/momenurmaruf2742/taxsuite-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: tax_frontend_prod
    restart: always
    ports:
      - "3000:80"
    env_file:
      - ./frontend/.env

volumes:
  postgres_data_prod:
  redis_data_prod:
